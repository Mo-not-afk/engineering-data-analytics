[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-data-analytics"
version = "0.1.0"
description = "A local engineering measurement ingestion and analytics platform"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
engineering-analytics = "engineering_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engineering_analytics = ["schema.sql", "static/*.html"]
